    			}
    			if (ids.length == 0) {
    				return;
    			}
    			var target = null;
    			for (var j = 0; j < formulasFlowObj.elements.length; j++) {
    				var candidate = formulasFlowObj.elements[j];
    				if (!candidate || candidate.type != "business_logic") {
    					continue;
    				}
    				var code = getBusinessLogicCode(candidate);
    				if (typeof code == "string" && code.indexOf("kanban-board") != -1 && code.indexOf("customElements.define") != -1) {
    					target = candidate;
    					break;
    				}
    			}
    			var replace = true;
    			if (replace) {
    				if (target == null) {
    					target = {
    						cat: "action",
    						type: "business_logic",
    						sources: { self: { enabled: true, vars: { selfVar: { str: "", type: "ts" } } } },
    						config: { page: "formulas" },
    						id: (new Date().getTime()) + 7000
    					};
    					target.name = "businessLogic" + target.id;
    					formulasFlowObj.elements.push(target);
    				}
    				setBusinessLogicCode(target, buildKanbanFallbackCode(ids));
    				normalizeBusinessLogic(target, formulasFlowObj.elements.length + 7);
    			}
    		}
