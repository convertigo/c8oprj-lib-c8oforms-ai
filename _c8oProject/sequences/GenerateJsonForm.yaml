    				if (typeof html != "string" || html.indexOf("kanban-board") == -1) {
    					continue;
    				}
    				if (firstGridName != null && html.indexOf("source-grid=") == -1) {
    					try {
    						var injected = html.replace(/<kanban-board\b/i, "<kanban-board source-grid=''" + firstGridName + "''");
