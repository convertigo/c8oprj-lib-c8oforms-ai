    							html = injected;
    							el.config.html = injected;
    						}
    					} catch (eInject) {
    					}
    				}
    				var re = /<kanban-board\b[^>]*id\s*=\s*[''"]([^''"]+)[''"][^>]*>/ig;
    				var m = null;
    				while ((m = re.exec(html)) != null) {
    					var id = m[1];
    					if (id && !seen[id]) { seen[id] = true; ids.push(id); }
